[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bw_temporalis"
authors = [
  { name="Chris Mutel", email="cmutel@gmail.com" }
]
maintainers = [
  { name="Chris Mutel", email="cmutel@gmail.com" }
]
description = "Revision of bw2temporalis for modern Brightway"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["brightway", "development"]
dynamic = ["version"]
# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]
requires-python = ">=3.10"
dependencies = [
    "bw2calc>=2.0.dev13",
    "bw2data>=4.8",
    "bw_graph_tools",
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
]

[project.urls]
source = "https://github.com/brightway-lca/bw_temporalis"
homepage = "https://github.com/brightway-lca/bw_temporalis"
tracker = "https://github.com/brightway-lca/bw_temporalis/issues"

[project.optional-dependencies]
# Getting recursive dependencies to work is a pain, this
# seems to work, at least for now
testing = [
    "bw_temporalis",
    "pytest",
    "pytest-cov",
]
dev = [
    "build",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "setuptools",
]
docs = [
    "sphinx",
    "myst_parser",
    "furo",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bw_temporalis*"]

[tool.setuptools.dynamic]
# `bw_temporalis.__version__` is a tuple read from the installed metadata,
# so the version string lives in this file instead
version = {file = "bw_temporalis/VERSION"}

[tool.pytest.ini_options]
addopts = "--cov bw_temporalis --cov-report term-missing --verbose"
norecursedirs = [
    "dist",
    "build",
    ".tox"
]
testpaths = ["tests/*.py"]

[tool.flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = ["E203", "W503", "E501"]
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
#    E501 (line length) is left to black
exclude = [
    ".tox",
    "build",
    "dist",
    ".eggs",
    "docs/conf.py",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
extend_skip_glob = ["bw_temporalis/__init__.py"]
filter_files = true
